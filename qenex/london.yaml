# QENEX LTD London — Hermes runtime contract
# Verified 2026-09-13 from Cursor Ultra + live MCP (mcp.qenex.ai) + public probes.
# Companion Cursor Ultra: PR #82 merged; ranking follow-up https://github.com/qenex-ai/cursor/pull/83
#
# Canonical OpenClaw is https://claw.qenex.ai (TLS Let's Encrypt YE1, Keycloak SSO 302).
# hermes.qenex.ai has TLS (YE2) and HTTPS 301s to claw.
# Call the OpenAI-compatible API on claw, not the alias:
#   POST https://claw.qenex.ai/v1/chat/completions  → 401 without SSO/token
#
# MCP origin is POST https://mcp.qenex.ai/ (initialize then tools/list). POST /mcp is 404.
# Billing: Cursor Ultra included models only (Cursor Grok + Composer).
# Do NOT call api.x.ai, grok-4 on-demand, OpenAI keys, or qenex_provider_switch.
# London MCP active_provider and LCO reasoner stay on ollama.
#
# qenex-edge #89 baked llm/registrar/agents/pinata/email/webmail/domains/rekor.
# Remaining missing SNI: identity.qenex.ai, sso.qenex.ai, lco.qenex.ai.
# Never reverse_proxy LCO :8855/:8856. Never Caddy-expose Keycloak /admin or realm master.
#
# Grok Bot (PR #83) ranks remaining SNI first on every turn (no live probe).
# Bake from a CLEAN origin/main worktree. London cwd docs/failed-services-triage-2026-09-06
# is dirty and caused qenex-forgejo-sync non-fast-forward at 17:06Z — do not force-push it.

operator: QENEX LTD London
company_number: "16523814"

mcp:
  origin: https://mcp.qenex.ai
  jsonrpc: POST /
  initialize_then: tools/list
  sse: GET /sse
  oauth_resource: https://mcp.qenex.ai
  do_not_use: POST /mcp

openclaw:
  canonical: https://claw.qenex.ai
  alias: https://hermes.qenex.ai
  alias_behavior: HTTPS 301 to https://claw.qenex.ai/
  chat_completions: https://claw.qenex.ai/v1/chat/completions
  sso: /api/sso/login
  gateway_port: 18789

grok:
  billing: included-in-ultra
  models: [cursor-grok, composer]
  london_mcp_active_provider: ollama
  do_not_call: [https://api.x.ai/v1, grok-4, qenex_provider_switch]
  estate_rank: remaining SNI identity/sso/lco first
  cursor_pr_ranking: https://github.com/qenex-ai/cursor/pull/83

lab:
  base: https://lab.qenex.ai
  health: /api/v1/lab/health
  molecules: /api/v1/lab/molecules  # Bearer required

git:
  forgejo: https://git.qenex.ai
  public_ui: GET /
  api_requires_token: /api/v1/*
  github_org: https://github.com/qenex-ai
  this_repo: qenex-ai/hermes-agent
  caddy_source_of_truth: git.qenex.ai/root/qenex-edge
  never_force_push: docs/failed-services-triage-2026-09-06

identity:
  canonical: https://auth.qenex.ai
  realm: qenex
  oidc: https://auth.qenex.ai/realms/qenex/.well-known/openid-configuration
  access_token_lifespan_sec: 300
  registration_allowed: false
  aliases_missing_sni: [identity.qenex.ai, sso.qenex.ai]
  bake: 301 identity.qenex.ai and sso.qenex.ai → https://auth.qenex.ai{uri}
  do_not_expose: [realm master, /admin]

lco:
  name: Living Cognitive OS
  sense: http://127.0.0.1:8855
  cache: http://127.0.0.1:8856
  reasoner_backend: ollama
  public_alias: https://lco.qenex.ai
  bake: 301 lco.qenex.ai → https://lab.qenex.ai{uri}
  never_reverse_proxy: [8855, 8856]
  agent_bus_seat_is_not_this_os: lco
  dispatch_seat: mcp
  tools: [qenex_lco_probe, qenex_lco_brain_status, qenex_lco_brain_observe, qenex_lco_brain_recommend]

ipfs:
  pinata_api: https://api.pinata.cloud
  london_kubo_peer: 12D3KooWRfLHg4wGktiyb2M4hQ8dMJMft6Jg1Qo8djb1kuZGDS7n
  evidence: https://ipfs.qenex.ai
  pinata_alias_live: HTTPS 301 pinata.qenex.ai → https://qenex.ai/legal/evidence/
  pin_add: qenex_ipfs_pin_add  # CID argument, dry_run default; not JSON

mail:
  canonical: mail.qenex.ai
  imap: { host: mail.qenex.ai, port: 993, tls: true }
  smtp: { host: mail.qenex.ai, port: 587, starttls: true }
  aliases_live: HTTPS 301 email.qenex.ai and webmail.qenex.ai → mail.qenex.ai

registrar:
  public_rdap: https://rdap.qenex.ai
  operator_vhost_live: https://registrar.qenex.ai  # TLS HTTP 200 application/rdap+json after qenex-edge #89
  domains_vhost_live: https://domains.qenex.ai

