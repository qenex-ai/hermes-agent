# QENEX LTD London — Hermes runtime contract
# Verified 2026-09-13 from Cursor Ultra + live MCP (mcp.qenex.ai v45).
#
# Self-hosted hostnames hermes.qenex.ai and llm.qenex.ai resolve via
# wildcard *.qenex.ai A 198.244.164.221 but have no Caddy TLS vhost
# (OpenSSL alert 80). systemd units hermes-agent and qenex-hermes are
# inactive. Do not send OpenAI-compatible traffic there until ops applies
# ops/london/missing-sni.caddy from qenex-ai/cursor and starts the unit.
#
# Until then: run this checkout locally (or on a loopback bind) and talk
# to the London stack through MCP origin POST https://mcp.qenex.ai/
# (POST /mcp is 404). Cursor Ultra (qenex-ai/cursor) is the operator console.

