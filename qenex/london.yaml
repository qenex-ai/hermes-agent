# QENEX LTD London — Hermes runtime contract
# Verified 2026-09-13 from Cursor Ultra + live MCP (mcp.qenex.ai) + public probes.
#
# Canonical OpenClaw is https://claw.qenex.ai (TLS Let's Encrypt YE1, Keycloak SSO 302).
# hermes.qenex.ai now has TLS (YE2, issued 2026-09-13) and HTTPS 301s to claw.
# Call the OpenAI-compatible API on claw, not the alias:
#   POST https://claw.qenex.ai/v1/chat/completions  → 401 without SSO/token
# systemd unit openclaw-gateway.service is not-found; the app is still served via Caddy.
#
# MCP origin is POST https://mcp.qenex.ai/ (initialize then tools/list). POST /mcp is 404.
# Cursor Ultra (qenex-ai/cursor) is the operator console.
#
# Billing: Cursor Ultra included models only (Cursor Grok + Composer).
# Do NOT call api.x.ai, grok-4 on-demand, OpenAI keys, or qenex_provider_switch.
# London MCP active_provider is ollama.

operator: QENEX LTD London
company_number: "16523814"

mcp:
  origin: https://mcp.qenex.ai
  jsonrpc: POST /
  initialize_then: tools/list
  sse: GET /sse
  oauth_resource: https://mcp.qenex.ai
  do_not_use: POST /mcp

openclaw:
  canonical: https://claw.qenex.ai
  alias: https://hermes.qenex.ai
  alias_behavior: HTTPS 301 to https://claw.qenex.ai/
  chat_completions: https://claw.qenex.ai/v1/chat/completions
  sso: /api/sso/login
  gateway_port: 18789

grok:
  # Editor inference stays on Cursor Ultra included models. Never api.x.ai.
  billing: included-in-ultra
  models: [cursor-grok, composer]
  london_mcp_active_provider: ollama
  do_not_call: [https://api.x.ai/v1, grok-4, qenex_provider_switch]

